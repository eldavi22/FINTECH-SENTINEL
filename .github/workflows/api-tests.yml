name: API and risk checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install API and test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Check Python syntax
        run: python -m compileall -q app/main.py tests
      - name: Run API and risk assertions
        run: python -m unittest discover -s tests -v
